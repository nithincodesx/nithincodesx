nt-size="12.5" fill="#3a3a3c">Supabase</text></g><g class="p" style="animation-delay:2.99s"><rect x="48" y="75" width="112" height="30" rx="15" fill="#fafaf8" stroke="#dcdcd7"/><text x="104" y="96" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#3a3a3c">PostgreSQL</text></g><g class="p" style="animation-delay:3.06s"><rect x="170.0" y="75" width="95" height="30" rx="15" fill="#fafaf8" stroke="#dcdcd7"/><text x="217" y="96" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#3a3a3c">Firebase</text></g><g class="p" style="animation-delay:3.13s"><rect x="274.8" y="75" width="52" height="30" rx="15" fill="#fafaf8" stroke="#dcdcd7"/><text x="301" y="96" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#3a3a3c">Git</text></g>
