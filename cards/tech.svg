<g class="p" style="animation-delay:2.70s"><rect x="48" y="40" width="78" height="32" rx="16" fill="#131c33" stroke="#26314d"/><text x="87" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">Python</text></g><g class="p" style="animation-delay:2.78s"><rect x="135.6" y="40" width="112" height="32" rx="16" fill="#131c33" stroke="#26314d"/><text x="192" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">TypeScript</text></g><g class="p" style="animation-delay:2.86s"><rect x="257.6" y="40" width="69" height="32" rx="16" fill="#131c33" stroke="#26314d"/><text x="292" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">React</text></g><g class="p" style="animation-delay:2.94s"><rect x="336.6" y="40" width="86" height="32" rx="16" fill="#131c33" stroke="#26314d"/><text x="380" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">Next.js</text></g><g class="p" style="animation-delay:3.02s"><rect x="432.8" y="40" width="86" height="32" rx="16" fill="#131c33" stroke="#26314d"/><text x="476" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">FastAPI</text></g><g class="p" style="animation-delay:3.10s"><rect x="529.0" y="40" width="86" height="32" rx="16" fill="#131c33" stroke="#26314d"/><text x="572" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">Node.js</text></g><g class="p" style="animation-delay:3.18s"><rect x="625.2" y="40" width="95" height="32" rx="16" fill="#131c33" stroke="#26314d"/><text x="673" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">Supabase</text></g><g class="p" style="animation-delay:3.26s"><rect x="48" y="80" width="112" height="32" rx="16" fill="#131c33" stroke="#26314d"/><text x="104" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">PostgreSQL</text></g><g class="p" style="animation-delay:3.34s"><rect x="170.0" y="80" width="95" height="32" rx="16" fill="#131c33" stroke="#26314d"/><text x="217" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">Firebase</text></g><g class="p" style="animation-delay:3.42s"><rect x="274.8" y="80" width="52" height="32" rx="16" fill="#131c33" stroke="#26314d"/><text x="301" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">Git</text></g>
